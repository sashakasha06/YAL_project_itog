<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }} - Просмотр письма</title>
    <style>
        .email-actions {
            margin-bottom: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .reply-btn {
            background: #4CAF50;
            color: white;
        }
        .ai-reply-btn {
            background: #2196F3;
            color: white;
        }
        .delete-btn {
            background: #f44336;
            color: white;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .email-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .email-meta {
            color: #666;
            font-size: 14px;
        }
        .email-body {
            margin-top: 20px;
        }
        .email-html-content {
            background: white;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .email-text-content {
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="email-actions">
        <button class="action-btn reply-btn" onclick="replyEmail()">Ответить</button>
        <button class="action-btn ai-reply-btn" onclick="aiReply()">Ответить с помощью AI</button>
        <button class="action-btn delete-btn" onclick="return deleteEmail(event)">Удалить письмо</button>
    </div>

    <div class="email-header">
        <h1>{{ subject }}</h1>
        <div class="email-meta">
            <strong>От:</strong> {{ from_email }}<br>
            <strong>ID письма:</strong> {{ email_id }}
        </div>
    </div>

    <div class="email-body">
        {% if html_content %}
            <div class="email-html-content">
                {{ html_content|safe }}
            </div>
            <hr>
            <div class="email-text-content">
                {{ content }}
            </div>
        {% else %}
            <div class="email-text-content">
                {{ content }}
            </div>
        {% endif %}
    </div>

<script>
    function deleteEmail(event) {
        event.preventDefault(); // Блокируем действие по умолчанию

        if (confirm('Вы уверены, что хотите удалить это письмо? Действие нельзя отменить.')) {
            const deleteBtn = event.target;
            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Удаление...';

            fetch(`/delete_email/{{ email_id }}`, {
                method: 'POST',
                {#headers: {#}
                {#    'Content-Type': 'application/json',#}
                {#    'X-CSRFToken': '{{ csrf_token() }}'#}
                {#},#}
                credentials: 'same-origin'
            })
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сервера');
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard?deleted=true';
                } else {
                    throw new Error(data.error || 'Неизвестная ошибка');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(error.message);
                deleteBtn.disabled = false;
                deleteBtn.textContent = 'Удалить письмо';
            });
        }
        return false;
    }

    // Добавим обработчики для других кнопок
    function replyEmail(event) {
        event.preventDefault();
        window.location.href = `/reply_email/{{ email_id }}`;
    }

    function aiReply(event) {
        event.preventDefault();
        window.location.href = `/ai_reply/{{ email_id }}`;
    }
</script>
